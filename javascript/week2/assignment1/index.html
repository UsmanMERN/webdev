<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <link rel="stylesheet" href="style/style.css">

</head>

<body class="d-flex justify-content-center align-items-center">

    <header></header>

    <main>
        <div class="card bg-transparent border-0 ">
            <div class="cardtop p-2 rounded-2 rounded-bottom-0">
                <h2 class="text-white">⭐ My personal Information ⭐</h2>
            </div>
            <div class="card-body p-2 rounded-2 bg-light rounded-top-0" id="card-body">
                <label for="name" class="form-label">👨🏻‍🦰 Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
                <label for="age" class="form-label">🎂 Age</label>
                <input type="number" class="form-control" id="age" placeholder="Enter your age">
                <label for="address" class="form-label">🌎 Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter your address">
                <button class="btn btn-danger w-100 rounded-5 mt-3" id="submitbtn">💫 Calculate my Info
                    💫</button>

                <div class="d-none" id="message"></div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
