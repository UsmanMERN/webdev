<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths And Numbers Array & Date and Time</title>
    <link rel="stylesheet" href="./style/style.css">

<body>

                    <div class="col-12">

                    <div class="col-12">
                        <label class="w-100">
                            2 Number
                            <input type="number" name="number2" id="num2" class="form-control">
                        </label>
                    </div>
                    <div class="col-12 d-flex justify-content-center align-items-center">
                        <button type="submit" class="btn btn-info w-50 mt-3">Submit</button>
                    </div>
                </div>
            </div>

        </form>
    </main>

    <footer></footer>

    <script src="./script/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
