<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - My Portfolio</title>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>
        <h1>My Projects</h1>

        <!-- Project Submission Form -->
        <h2>Submit a Project Idea</h2>
        <form>
            <fieldset>
                <legend>Project Details</legend>
                <label for="email">Email:</label><br>
                <input type="email" id="email" required><br>
                <label for="tel">Phone:</label><br>
                <input type="tel" id="tel" pattern="[0-9]{10}"><br>
                <label for="url">Website:</label><br>
                <input type="url" id="url"><br>
                <label for="date">Deadline:</label><br>
                <input type="date" id="date" min="2023-10-16"><br>
                <label for="color">Theme Color:</label><br>
                <input type="color" id="color"><br>
                <label for="desc">Description:</label><br>
                <textarea id="desc" required></textarea><br>
                <label for="type">Project Type:</label><br>
                <select id="type">
                    <option value="web">Web Development</option>
                    <option value="app">App Development</option>
                </select>
            </fieldset>
        </form>

        <!-- Multimedia -->
        <h2>Project Media</h2>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            <source src="audio.wav" type="audio/wav">
            Your browser does not support the audio element.
        </audio>
        <video controls>
            <source src="video.mp4" type="video/mp4">
            <source src="video.webm" type="video/webm">
            <track src="subtitles.vtt" kind="subtitles" srclang="en" label="English">
            Your browser does not support the video element.
        </video>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2023 My Portfolio</p>
    </footer>

</body>

</html>
