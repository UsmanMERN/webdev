<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    div>p {
        color: red;
        font-size: 20px;
        font-weight: bold;
    }

    div+p {
        color: blue;
    }

    p>span {
        color: green;
        font-size: 30px;
    }
</style>

<body>

    <div>
        <p>First paragraph</p>
        <p>Second paragraph</p>
        <p>Third paragraph</p>
        <h2>Heading</h2>
        <p>Paragraph under heading
        <p>paragraph <span>inside</span> p tag</p>
        <span>
            <p>paragraph inside span tag</p>
        </span>
        </p>
    </div>
    <p>Outside paragraph #1</p>
    <p>Outside paragraph #2</p>


</body>

</html>
